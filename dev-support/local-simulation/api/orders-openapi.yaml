openapi: 3.0.3
info:
  title: MateClaw Local Orders API
  version: 1.0.0
  description: 脱敏本地测试接口；不包含真实认证信息。
servers:
  - url: https://127.0.0.1:18443
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PAID, CANCELLED, PENDING]
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required: [id, customer_id, order_date, status, amount]
      properties:
        id: {type: integer, format: int64}
        customer_id: {type: integer, format: int64}
        order_date: {type: string, format: date-time}
        status: {type: string}
        amount: {type: number, format: double}
        nullable_note: {type: string, nullable: true}
