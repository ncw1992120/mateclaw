  DB_USERNAME: "postgres"
  DB_PASSWORD: "root"
  # Elasticsearch 账密（对应 ${ES_USERNAME} / ${ES_PASSWORD}）
  ES_USERNAME: "elastic"
  ES_PASSWORD: "TWMM22KT82GJW7P77LK87lY4"
