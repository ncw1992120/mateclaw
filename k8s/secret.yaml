  JWT_SECRET: "change-me-to-a-long-random-secret-in-production"
  # DashScope LLM API Key（对应 ${AI_DASHSCOPE_API_KEY}）
  AI_DASHSCOPE_API_KEY: "your-dashscope-api-key"
