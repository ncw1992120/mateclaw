[project]
name = "mateclaw-python-runner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pandas==2.2.3",
  "polars==1.20.0",
  "pyarrow==18.1.0",
  "uvicorn==0.34.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
