<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MateClaw · AI 报表共创工作台</title><link rel="stylesheet" href="workbench.css"></head><body>
<nav class="rail"><b class="logo">m</b><button id="scenesToggle" title="场景目录">▦</button><button id="history" title="版本记录">◷</button><span>MC</span></nav>
<main><header><div><small>MateClaw / 共创空间</small><h1>销售经营日报 <em>交互演示</em></h1></div><div class="actions"><button id="undo">↶ 撤销</button><button id="save">保存草稿</button><button id="versions">版本</button><a href="report.html" target="_blank">独立打开日报 ↗</a></div></header>
<div class="workspace"><aside class="conversation"><div class="chat-heading"><div><strong>✧ 报表共创助手</strong><small>描述 → 生成 → 调整 → 查询 → 验证</small></div><span class="online">本地模拟</span></div><div class="journey"><button id="start" class="primary">开始完整共创</button><button id="next">下一轮 →</button><button id="auto">自动继续</button><span id="round">等待开始</span></div><div id="context"><span>讨论范围：整张报表</span></div><div id="messages" aria-live="polite"></div><div class="compose"><div id="suggestions"></div><textarea id="prompt" aria-label="描述报表需求" placeholder="先点选右侧组件，再告诉 Agent 怎么改；也可以说：整张报表切换为蓝青科技风…"></textarea><div><button id="library">全部 26 个场景</button><span>预设应答 · 页面实时变化</span><button id="send" class="primary">发送 ↑</button></div></div></aside>
<section class="artifact"><div class="artifact-bar"><span><i></i> <b>销售经营日报.html</b> <small id="artifactVersion">尚未生成</small></span><div class="canvas-toolbar"><div class="mode-switch" role="group" aria-label="画布模式"><button type="button" data-view-mode="edit" aria-pressed="true">✎ 编辑</button><button type="button" data-view-mode="preview" aria-pressed="false">▷ 预览</button></div><div id="zoomTools" class="zoom-tools" role="toolbar" aria-label="画布缩放"><button type="button" data-zoom="-10" aria-label="缩小画布">−</button><span id="zoomValue">100%</span><button type="button" data-zoom="10" aria-label="放大画布">＋</button><button type="button" data-zoom="reset">适配</button></div><button id="inspect">属性</button><button id="validate">验证范围</button></div></div><div class="artifact-body"><iframe id="report" title="销售经营日报编辑画布" src="report.html"></iframe><div id="empty"><span>✧</span><h2>从一句需求开始</h2><p>告诉 Agent 你想看到什么，<br>可交互报表将在这里逐步生成。</p><button id="emptyStart" class="primary">生成销售经营日报 →</button><small>生成后可选中、拖动和缩放组件，也可与 Agent 共创</small></div><aside id="inspector" hidden></aside></div><footer><span id="status">准备就绪</span><span id="saved">未保存 · 全部数据与接口均为模拟</span></footer></section></div></main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status" hidden></div><script src="workbench.js"></script></body></html>
