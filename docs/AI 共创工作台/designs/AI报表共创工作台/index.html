<script>
'use strict';
// Entirely local mock transport. UI transitions, filtering, editing and persistence are real.
const $=id=>document.getElementById(id), clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mateclaw-report-workbench-v1', departments=['华东区','华南区','华北区','西部区'];
const types={kpi:'指标卡',line:'折线图',bar:'柱状图',pie:'饼图',table:'数据表格',text:'文本'};
let sequence=0, epoch=0, requestSeq=0, selected=null, inspectorTab='style', mode='edit', dirty=true, undoStack=[],redoStack=[],snapshots=[], dragging=null, tableView={},busy=false;
let logs=[];
const uid=()=>`component-${Date.now().toString(36)}-${++sequence}`;
function component(type,title,metric='sales'){return{id:uid(),type,title,metric,color:'#43cfe7',mode:'sample',scenario:'normal',field:'value',group:type==='bar'||type==='pie'?'dept':'date',width:type==='table'?'wide':'normal',status:'ready',error:null,revision:1,verified:false,businessChecked:false,result:null,stamp:null,text:'在这里记录报表说明。点击组件后可编辑内容。'}}
function initial(title='销售精英分析'){return{title,theme:'cyan',month:'2026-10',dept:'全部部门',revision:1,components:[component('kpi','销售收入'),component('kpi','成交订单','orders'),component('kpi','平均客单价','average'),component('line','每日销售趋势'),component('bar','部门销售排名'),component('table','销售明细')]}}
let state=initial();
let messages=[{role:'user',text:'做一个销售日报，展示销售收入、订单、部门排名和每日趋势。'},{role:'ai',text:'页面已经生成，你可以直接操作筛选和图表。\n\n点击任意组件，就能调整外观、绑定数据或继续告诉我你的想法。',activity:'已生成 6 个组件 · 当前均使用示例数据',quick:['把销售收入接入数据','部门排名改成饼图','新增一个趋势图']}];
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.state&&Array.isArray(saved.state.components)){state=saved.state;messages=saved.messages||messages;snapshots=saved.snapshots||[];state.components.forEach(c=>{if(c.mode==='bound'&&['loading','ready','empty'].includes(c.status)){c.status='stale';c.error=null}c.verified=false});dirty=false}}catch(e){logs.push({message:'本地草稿无法读取，已使用默认报表',at:new Date().toISOString()})}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3000)}
function current(){return state.components.find(c=>c.id===selected)}
function record(){undoStack.push(clone(state));if(undoStack.length>35)undoStack.shift();redoStack=[];dirty=true;state.revision++}
function change(fn){record();fn();render()}
function touch(c){c.revision++;c.verified=false;c.businessChecked=false;c.error=null;if(c.mode==='bound')c.status='stale'}
function log(c,stage,message){logs.unshift({component:c.title,id:c.id,stage,message,request:c.request||null,at:new Date().toISOString()});logs=logs.slice(0,80)}
function restore(s){epoch++;state=clone(s);state.components.forEach(c=>{c.verified=false;if(c.mode==='bound'&&['loading','ready','empty'].includes(c.status))c.status='stale'});if(!current())selected=null;dirty=true;render()}
function undo(){if(!undoStack.length)return;redoStack.push(clone(state));restore(undoStack.pop());toast('已撤销，页面和数据配置一起恢复')}
function redo(){if(!redoStack.length)return;undoStack.push(clone(state));restore(redoStack.pop());toast('已重做')}
function message(text,role='ai',extra={}){messages.push({role,text,...extra});renderChat()}
function renderChat(){$('context').textContent=current()?.title||'整张报表';$('messages').innerHTML=messages.map(m=>`<div class="message ${m.role}"><div class="who">${m.role==='ai'?'<i>✧</i>MateClaw':'你'}</div><div class="bubble">${esc(m.text)}</div>${m.steps?`<ol class="agent-steps">${m.steps.map((t,i)=>`<li class="${i<m.step?'done':i===m.step?'running':''}"><span>${i<m.step?'✓':i===m.step?'◉':'○'}</span>${esc(t)}</li>`).join('')}</ol>`:''}${m.pending?'<div class="agent-working"><div class="spinner"></div>Agent 正在处理</div>':''}${m.activity?`<div class="activity">✓ ${esc(m.activity)}</div>`:''}${m.quick?`<div class="quick">${m.quick.map(q=>`<button data-prompt="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
function rowsFor(c){const month=Number(state.month.slice(-2));let rows=[];for(let day=1;day<=22;day++)for(let d=0;d<4;d++){const factor=c.mode==='bound'?1.17:1;const sales=Math.round((9900+day*173+((day*7+d*19)%23)*620+d*2700)*factor*(.8+month/30));const orders=23+((day*11+d*7)%46);rows.push({date:`${state.month}-${String(day).padStart(2,'0')}`,dept:departments[d],sales,orders,average:Math.round(sales/orders)})}return rows.filter(r=>state.dept==='全部部门'||r.dept===state.dept)}
function dataFor(c){return c.mode==='sample'?rowsFor(c):(c.result||[])}
function aggregate(rows,metric){if(metric==='average')return rows.length?rows.reduce((a,r)=>a+r.sales,0)/rows.reduce((a,r)=>a+r.orders,0):0;return rows.reduce((a,r)=>a+r[metric],0)}
function grouped(c,rows){const groups=new Map;for(const r of rows){const k=r[c.group];if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}return [...groups].map(([label,items])=>({label,value:aggregate(items,c.metric)}))}
function format(v,metric){return metric==='orders'?Math.round(v).toLocaleString('zh-CN'):(metric==='average'?Math.round(v).toLocaleString('zh-CN'):(v/10000).toFixed(2))}
function unit(c){return c.metric==='orders'?'笔':c.metric==='average'?'元':'万元'}
const errors={query:['数据查询失败','模拟查询服务暂时不可用，请重试。'],timeout:['数据查询超时','本次请求超过模拟服务时限，可重试或缩小时间范围。'],denied:['暂无数据访问权限','模拟账号无权访问当前指标，请选择可访问的数据源。'],field:['数据字段不匹配','返回结果缺少数值字段「amount_missing」，请修正映射。'],render:['图表渲染失败','图表配置不兼容，模拟渲染器抛出异常。']};
async function runQuery(c,{binding=false}={}){if(!c||c.type==='text')return;if(binding){record();c.mode='bound';touch(c);renderInspector()}const token=++requestSeq,version=epoch;c.request=token;c.status='loading';c.error=null;c.verified=false;dirty=true;render(true);const data=rowsFor(c);const scenario=c.scenario,field=c.field,revision=c.revision;log(c,'query','开始查询');await new Promise(r=>setTimeout(r,scenario==='timeout'?1600:650));if(version!==epoch||!state.components.includes(c)||c.request!==token||revision!==c.revision)return;
if(['query','timeout','denied'].includes(scenario)){c.status='error';c.error=scenario;log(c,'query',errors[scenario][1])}else if(field==='missing'){c.status='error';c.error='field';log(c,'validation',errors.field[1])}else{c.result=scenario==='empty'?[]:data;c.stamp=new Date().toLocaleTimeString('zh-CN',{hour12:false});c.status=c.result.length?'ready':'empty';c.resultParams={month:state.month,dept:state.dept};log(c,'query',`返回 ${c.result.length} 行，待渲染`)}render(true);return c.status}
function errorHTML(c){const err=errors[c.error]||['组件暂时无法显示','请查看详情或重新渲染。'];return `<div class="status-panel"><div class="error-symbol">!</div><h3>${err[0]}</h3><p>${err[1]}</p><div class="row"><button class="btn small" data-retry="${c.id}">${c.error==='render'?'重新渲染':'重试'}</button><button class="btn small" data-repair="${c.id}">✧ AI 修复</button><button class="btn small" data-details="${c.id}">详情</button></div></div>`}
function chart(c,rows){if(c.scenario==='render')throw Error('SIMULATED_RENDER_FAILURE');if(c.type==='text')return `<div style="padding:15px 0;white-space:pre-wrap;color:#6e7d95;font-size:12px">${esc(c.text)}</div>`;
if(c.type==='kpi'){const v=aggregate(rows,c.metric);return `<div class="number">${format(v,c.metric)}<span>${unit(c)}</span></div><div class="comparison"><b>↗ ${c.mode==='sample'?'12.8':'8.6'}%</b>较上期 · 演示对比</div>`}
if(c.type==='table')return table(c,rows);
let values=grouped(c,rows);if(c.type==='bar'){values.sort((a,b)=>b.value-a.value);const max=Math.max(...values.map(x=>x.value),1);return `<div style="padding-top:4px">${values.slice(0,8).map((x,i)=>`<div class="rank-row"><button data-dept="${esc(x.label)}" title="点击筛选该部门">${esc(x.label)}</button><div class="bar"><div style="width:${x.value/max*100}%;background:${c.color};opacity:${Math.max(.4,1-i*.08)}"></div></div><b>${format(x.value,c.metric)}</b></div>`).join('')}<small class="muted">单位：${unit(c)}${values.length>8?' · 显示前 8 项':''}${c.group==='dept'?' · 点击部门可联动筛选':''}</small></div>`}
if(c.type==='pie'){const sum=values.reduce((a,x)=>a+x.value,0)||1;let offset=0;return `<div class="row" style="justify-content:center;gap:20px;padding:22px 0"><svg width="155" height="155" viewBox="0 0 160 160" role="img" aria-label="${esc(c.title)}占比图">${values.map((x,i)=>{const n=x.value/sum*100;const path=`<circle cx="80" cy="80" r="55" fill="none" stroke="${c.color}" opacity="${Math.max(.25,1-i*.16)}" stroke-width="23" pathLength="100" stroke-dasharray="${Math.max(0,n-.8)} ${100-Math.max(0,n-.8)}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"><title>${esc(x.label)}：${n.toFixed(1)}%</title></circle>`;offset+=n;return path}).join('')}<text x="80" y="77" text-anchor="middle" style="font-size:12px;fill:#8393ac">合计</text><text x="80" y="98" text-anchor="middle" style="font-size:16px;fill:#344763">${format(sum,c.metric)}</text></svg><div>${values.slice(0,7).map((x,i)=>`<div style="margin:9px 0;font-size:10px"><i class="dot" style="color:${c.color};opacity:${Math.max(.25,1-i*.16)};margin-right:5px"></i>${esc(x.label)} <b style="margin-left:10px;font-weight:500">${(x.value/sum*100).toFixed(1)}%</b></div>`).join('')}</div></div>`}
const max=Math.max(...values.map(x=>x.value),1)*1.2;const pts=values.map((x,i)=>[43+i*414/Math.max(values.length-1,1),158-x.value/max*130]);return `<svg class="plot" viewBox="0 0 480 195" role="img" aria-label="${esc(c.title)}趋势图">${[0,1,2,3].map(n=>`<line x1="42" y1="${28+n*43.3}" x2="465" y2="${28+n*43.3}" stroke="#edf1f7" stroke-dasharray="3 3"/><text x="34" y="${31+n*43.3}" text-anchor="end">${format(max*(3-n)/3,c.metric)}</text>`).join('')}<polygon points="${pts.map(p=>p.join(',')).join(' ')} 457,158 43,158" fill="${c.color}" opacity=".07"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c.color}" stroke-width="2.3" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle class="point" cx="${p[0]}" cy="${p[1]}" r="2.5" fill="white" stroke="${c.color}" stroke-width="1.5"><title>${esc(values[i].label)}：${format(values[i].value,c.metric)} ${unit(c)}</title></circle>${i%5===0||i===pts.length-1?`<text x="${p[0]}" y="180" text-anchor="middle">${esc(values[i].label.slice(5))}</text>`:''}`).join('')}</svg>`}
function table(c,rows){const v=tableView[c.id]||(tableView[c.id]={page:1,search:'',sort:'date',dir:1});let list=rows.filter(r=>`${r.date}${r.dept}`.includes(v.search));list.sort((a,b)=>typeof a[v.sort]==='number'?(a[v.sort]-b[v.sort])*v.dir:String(a[v.sort]).localeCompare(String(b[v.sort]))*v.dir);const pages=Math.max(1,Math.ceil(list.length/5));v.page=Math.min(pages,v.page);const slice=list.slice((v.page-1)*5,v.page*5);return `<div class="table-toolbar"><input class="search" data-search="${c.id}" aria-label="搜索销售明细" placeholder="搜索日期或部门…" value="${esc(v.search)}"><button class="btn small" data-export="${c.id}">↓ 导出 CSV</button></div><div class="table-wrap"><table class="data-table"><thead><tr>${[['date','日期'],['dept','部门'],['orders','成交订单'],['sales','销售额（元）'],['average','客单价（元）']].map(([k,n])=>`<th><button data-sort="${c.id}" data-key="${k}">${n} ${v.sort===k?(v.dir===1?'↑':'↓'):'↕'}</button></th>`).join('')}</tr></thead><tbody>${slice.map(r=>`<tr><td>${r.date}</td><td>${r.dept}</td><td>${r.orders}</td><td>${r.sales.toLocaleString('zh-CN')}</td><td>${r.average.toLocaleString('zh-CN')}</td></tr>`).join('')||'<tr><td colspan="5">没有匹配的明细</td></tr>'}</tbody></table></div><div class="pagination"><span>共 ${list.length} 条 · 每页 5 条</span><div class="row"><button class="btn small" data-page="${c.id}" data-step="-1" ${v.page===1?'disabled':''}>上一页</button><span>${v.page} / ${pages}</span><button class="btn small" data-page="${c.id}" data-step="1" ${v.page===pages?'disabled':''}>下一页</button></div></div>`}

else if(d.id==='filter'){changeFilters('2026-09','华东区');await pause(750)}
else if(d.id==='error'||d.id==='repair'){let c=state.components.find(c=>c.title.includes('趋势')||c.type==='line');if(!c)throw Error('请先生成包含销售趋势的看板');record();c.mode='bound';c.scenario=d.id==='error'?'query':'normal';c.field='value';touch(c);selected=null;render();await runQuery(c)}
entry.step=2;renderChat();flashReport();await pause(600);entry.step=3;entry.pending=false;entry.text=d.id==='style'&&state.theme==='cyan'?'已恢复青蓝科技主题，布局和数据绑定已保留。再次点击此提示词可切换紫色霓虹主题。':d.reply;entry.activity=d.id==='error'?'已定位 1 个查询错误 · 等待修复':'页面已更新 · 可继续交互 · 修改可撤销';renderChat();
}catch(e){entry.pending=false;entry.text='本次操作未完成：'+e.message;renderChat()}finally{busy=false;$('send').disabled=false;renderDemoPrompts(d.id)}}

async function send(text){text=(text||$('prompt').value).trim();if(!text||busy)return;const demo=demoScenarios.find(x=>x.prompt===text);if(demo){$('prompt').value='';return runDemo(demo)}$('prompt').value='';message(text,'user');busy=true;$('send').disabled=true;await new Promise(r=>setTimeout(r,350));try{let c=targetFor(text);
if(/新建|生成|做一|创建/.test(text)){if(state.components.length){confirmAction('生成新的报表','将替换当前页面，现有内容可通过撤销恢复。',()=>generateFrom(text))}else generateFrom(text)}
else if(/新增|添加|加一个/.test(text)){const t=/表格|明细/.test(text)?'table':/指标|卡片/.test(text)?'kpi':/饼图/.test(text)?'pie':/排名|柱/.test(text)?'bar':/文本|说明/.test(text)?'text':'line';const n=component(t,/趋势/.test(text)?'新增销售趋势':types[t]);change(()=>state.components.push(n));select(n.id);message('已添加「'+n.title+'」，可以直接编辑标题、样式或接入数据。')}
else if(/保存/.test(text)){save();message('已执行本地保存，请查看顶部保存状态。')}
else if(/撤销/.test(text)){undo();message('已执行撤销，页面与绑定配置同步恢复。')}
else if(/修复/.test(text)){if(c){await repair(c)}else message('请先选中一个有错误的组件，或在指令里写出组件名称。')}
else if(/绑定|接入|接到|接真实|连.*数据/.test(text)){if(!c){message('请先选择要绑定的组件，也可以说“把销售收入接入数据”。')}else{select(c.id,'data');await runQuery(c,{binding:true});message('已为「'+c.title+'」绑定模拟销售服务。'+(c.status==='ready'?'查询与渲染成功，示例水印已移除，来源标记为“接口模拟”。':'组件内已展示当前执行结果。'))}}
else if(/删除/.test(text)&&c){confirmAction('删除组件','将删除「'+c.title+'」，此操作可撤销。',()=>{change(()=>state.components=state.components.filter(x=>x!==c));selected=null;render();message('已删除指定组件。')})}
else if(/改|调整|换成/.test(text)&&c){const title=text.match(/(?:标题|名称)(?:改成|改为|修改为|改|为)[“"：:\s]*(.+?)[”"]?$/)?.[1];const t=/饼图/.test(text)?'pie':/柱状|条形/.test(text)?'bar':/折线/.test(text)?'line':null;const color=/绿色/.test(text)?'#38a58e':/橙色/.test(text)?'#de9858':/紫色/.test(text)?'#9480ce':/蓝色/.test(text)?'#6387e8':null;if(title||t||color){change(()=>{if(title)c.title=title;if(t){c.type=t;c.group=t==='line'?'date':'dept'}if(color)c.color=color;c.verified=false});message('已调整「'+c.title+'」，原数据绑定已保留。','ai',{activity:'页面已更新 · 可撤销'});select(c.id)}else message('当前模拟助手支持修改标题、折线/柱状/饼图类型和蓝/绿/橙/紫色。其他调整可使用右侧配置面板。')}
else if(/筛选|月份/.test(text)){message('月份与部门筛选已在页面顶部，可直接操作并联动所有图表与明细。')}
else message('当前为本地规则模拟助手。你可以尝试下方指令，也可以直接使用组件配置面板；未识别的指令不会改变页面。','ai',{quick:['生成销售日报','新增一个趋势图','把销售收入接入数据','部门排名改成饼图']})
}catch(e){message('操作未完成：'+e.message)}finally{busy=false;$('send').disabled=false}}
function download(name,content,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validate(){modal('当前页面验证',`<p>以下为当前浏览器实际渲染和模拟查询状态。业务口径需自行核对，不能据此判断真实数据已接通。</p>${state.components.map(c=>`<div class="list-row"><div><strong>${esc(c.title)}</strong><small>${c.mode==='sample'?'示例数据':c.status==='ready'?'模拟查询成功':c.status} · ${c.businessChecked?'口径已核对':'口径待核对'}</small></div><span class="badge ${c.status==='error'?'red':c.verified?'green':'amber'}">${c.status==='error'?'失败':c.verified?'渲染通过':'待验证'}</span></div>`).join('')}`)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.demo){runDemo(demoScenarios.find(x=>x.id===d.demo));return}if(d.prompt){send(d.prompt);return}if(d.select){select(d.select);return}if(d.bindPanel){select(d.bindPanel,'data');return}if(d.tab){inspectorTab=d.tab;renderInspector();return}if(d.mode){mode=d.mode;render();return}if(d.retry){const c=state.components.find(x=>x.id===d.retry);if(c.mode==='bound')runQuery(c);else{c.status='ready';render()}return}if(d.repair){repair(state.components.find(x=>x.id===d.repair));return}if(d.details){showDetails(state.components.find(x=>x.id===d.details));return}if(d.dept&&departments.includes(d.dept)){changeFilters(state.month,d.dept);return}if(d.move){const at=state.components.findIndex(c=>c.id===d.move),to=at+Number(d.dir);if(to>=0&&to<state.components.length)change(()=>{const [c]=state.components.splice(at,1);state.components.splice(to,0,c)});return}if(d.sort){let v=tableView[d.sort];v.dir=v.sort===d.key?-v.dir:1;v.sort=d.key;renderPaper();return}if(d.page){tableView[d.page].page+=Number(d.step);renderPaper();return}if(d.export){const c=state.components.find(x=>x.id===d.export);const v=tableView[c.id]||{search:''};const rows=dataFor(c).filter(r=>`${r.date}${r.dept}`.includes(v.search));download('销售明细-模拟数据.csv','\ufeff日期,部门,销售额（元）,订单,客单价（元）\n'+rows.map(r=>[r.date,r.dept,r.sales,r.orders,r.average].join(',')).join('\n'),'text/csv;charset=utf-8');toast('已导出演示 CSV');return}if(d.restore){const snap=snapshots.find(x=>String(x.id)===d.restore);$('modal').close();confirmAction('恢复保存版本','当前页面及查询配置将一起恢复，可通过撤销返回。',()=>{record();restore(snap.state);toast('已恢复版本，接口结果需重新验证')});return}
if(d.modal){if(d.modal==='confirm'){const fn=modalCallback;$('modal').close();modalCallback=null;fn?.()}else if(d.modal==='add'){const n=component($('newType').value,$('newTitle').value.trim()||types[$('newType').value]);$('modal').close();change(()=>state.components.push(n));select(n.id)}else if(d.modal==='rename'){const value=$('newReportName').value.trim();if(value){$('modal').close();change(()=>state.title=value)}}return}
const c=current();switch(d.action){case 'chat':if(innerWidth<=900)$('chat').classList.toggle('mobile-open');else document.body.classList.toggle('chat-hidden');break;case 'clear-selection':selected=null;render();break;case 'close-modal':$('modal').close();break;case 'save':save();break;case 'undo':undo();break;case 'redo':redo();break;case 'history':history();break;case 'rename':modal('重命名报表','<label class="field"><span>报表名称</span><input id="newReportName" value="'+esc(state.title)+'"></label>',[{id:'rename',label:'保存名称',primary:true}]);break;case 'add':addDialog();break;case 'new':confirmAction('创建空白报表','将打开空白画布。当前页面可通过撤销恢复，也可先保存版本。',()=>{record();epoch++;state={...initial('未命名报表'),components:[]};selected=null;render();message('空白画布已准备好。描述报表内容即可直接生成，例如“生成销售日报”。')});break;case 'refresh':state.components.forEach(c=>{if(c.mode==='bound'&&c.type!=='text')runQuery(c)});toast('已刷新页面；接口组件正在重新查询');break;case 'reset-filter':changeFilters('2026-10','全部部门');break;case 'validate':validate();break;case 'apply-style':if(c){const title=$('componentTitle').value.trim()||c.title,type=$('componentType').value,color=$('componentColor').value,width=$('componentWidth').value,text=$('componentText')?.value;change(()=>{c.title=title;c.type=type;c.color=color;c.width=width;if(text!==undefined)c.text=text;c.verified=false});toast('组件外观已更新，数据绑定保留')}break;case 'bind':if(c){record();c.metric=$('metric').value;c.group=$('group').value;c.field=$('field').value;c.scenario=$('scenario').value;c.mode='bound';touch(c);renderInspector();runQuery(c)}break;case 'sample':if(c)change(()=>{c.mode='sample';c.status='ready';c.error=null;c.scenario='normal';c.verified=false;c.stamp=null;c.request=++requestSeq;c.businessChecked=false});break;case 'business-check':if(c){if(c.status!=='ready'||!c.verified){toast('请先完成当前组件的查询和渲染');return}change(()=>c.businessChecked=true);toast('已记录当前组件的人工口径确认')}break;case 'duplicate':if(c){const copy=clone(c);copy.id=uid();copy.title+=' 副本';copy.request=null;if(copy.status==='loading')copy.status='stale';change(()=>state.components.push(copy));select(copy.id)}break;case 'delete':if(c)confirmAction('删除组件','将删除「'+c.title+'」，可使用撤销恢复。',()=>{change(()=>state.components=state.components.filter(x=>x.id!==c.id));selected=null;render()});break;case 'components':modal('报表组件',state.components.map(c=>`<div class="list-row"><div><strong>${esc(c.title)}</strong><small>${types[c.type]} · ${c.mode==='sample'?'示例数据':'接口模拟'}</small></div><button class="btn small" data-open-component="${c.id}">定位</button></div>`).join('')||'<p>暂无组件。</p>');break;case 'help':modal('开始共创',`<p>所有数据、接口和 AI 应答均为本地模拟。页面操作、查询状态、图表绘制和本地保存实际生效。</p><div class="chip-list">${['生成销售日报','新增一个趋势图','把销售收入接入数据','部门排名改成饼图','改成绿色','标题改为本月经营情况','修复这个图','保存报表'].map(x=>`<button data-help-prompt="${x}">${x}</button>`).join('')}</div><p style="margin-top:18px">点击组件标题打开配置。数据查询面板可模拟成功、空数据、查询失败、超时、权限和渲染错误。拖动标题或使用左右箭头调整顺序。</p>`);break}
if(d.openComponent){$('modal').close();select(d.openComponent);document.getElementById(d.openComponent)?.scrollIntoView({behavior:'smooth',block:'center'})}if(d.helpPrompt){$('modal').close();$('prompt').value=d.helpPrompt;$('prompt').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='month')changeFilters(e.target.value,state.dept);if(e.target.id==='dept')changeFilters(state.month,e.target.value)});
document.addEventListener('input',e=>{if(e.target.dataset.search){const id=e.target.dataset.search;tableView[id].search=e.target.value;tableView[id].page=1;const pos=e.target.selectionStart;renderPaper();const input=document.querySelector(`[data-search="${id}"]`);input.focus();input.setSelectionRange(pos,pos)}});
$('send').onclick=()=>send();$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save()}if((e.metaKey||e.ctrlKey)&&e.key==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();e.shiftKey?redo():undo()}if(e.key==='Escape'){selected=null;render();$('chat').classList.remove('mobile-open')}});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(el&&mode==='edit'){dragging=el.dataset.drag;e.dataTransfer.setData('text/plain',dragging);document.getElementById(dragging).classList.add('dragging')}});
document.addEventListener('dragover',e=>{const el=e.target.closest('.widget');if(el&&dragging){e.preventDefault();document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));el.classList.add('drop-target')}});
document.addEventListener('drop',e=>{const el=e.target.closest('.widget');if(el&&dragging&&el.id!==dragging){e.preventDefault();const from=state.components.findIndex(c=>c.id===dragging),to=state.components.findIndex(c=>c.id===el.id);change(()=>{const [c]=state.components.splice(from,1);state.components.splice(to,0,c)})}dragging=null;document.querySelectorAll('.drop-target,.dragging').forEach(n=>n.classList.remove('drop-target','dragging'))});
document.addEventListener('dragend',()=>{dragging=null;document.querySelectorAll('.drop-target,.dragging').forEach(n=>n.classList.remove('drop-target','dragging'))});
render();renderChat();renderDemoPrompts();
</script>
