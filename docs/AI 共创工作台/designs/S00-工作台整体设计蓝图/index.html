let current=0,view='screen',subtab=0,selected='产品整体';
const $=id=>document.getElementById(id);
$('chat').querySelector('.chat-head').insertAdjacentHTML('beforeend','<button class="btn mobile-chat chat-close" id="chatClose" aria-label="收起 AI 对话">收起</button>');
$('chatClose').onclick=()=>{$('chat').classList.remove('visible');$('chatToggle').focus()};
function runtimeDesign(){return `<div class="notice">运行与调试视图设计：正式 S02 通过模拟数据实际运行；以下为界面结构示意，没有执行日志。</div><div class="grid3">${['正常结果','空结果','加载 / 失败'].map(n=>`<div class="kpi"><span>模拟场景</span><div class="counter" style="font-size:18px">${n}</div><small>按场景检查界面与恢复路径</small></div>`).join('')}</div><div class="section-title"><h3>交互链路追踪 · 日志结构示意</h3></div>${table(['节点','应记录的内容','核查目的'],[['事件来源','组件 ID / 事件 / 时间','找到用户的实际操作'],['参数变化','旧值 / 新值 / 作用域','确保没有串页'],['模拟请求','机构 / 时间 / 分页 / 排序','验证输入契约'],['页面结果','数据版本 / 目标组件 / 错误','检查展示与请求一致']])}<div class="lifecycle">向 S03 移交稳定的数据端口与参数契约，替换数据提供方后继续复用页面与交互。</div>`}
const pill=(text,kind='')=>`<span class="pill ${kind}">${text}</span>`;
function deliver(){const s=stages[current];return `<div class="deliverable"><div><strong>${s.id} 阶段交付</strong><p>${s.deliver}</p></div><button class="btn" data-action="handoff">查看移交条件 →</button></div>`}
function table(headers,rows){return `<table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function intro(title,sub){return `<div class="intro"><div><h2>${title}</h2><p>${sub}</p></div>${pill(stages[current].id+' · '+stages[current].name,'blue')}</div>`}
function tabs(){return `<div class="tabs">${stages[current].tabs.map((t,i)=>`<button data-tab="${i}" class="${i===subtab?'active':''}" aria-pressed="${i===subtab}">${t}</button>`).join('')}</div>`}
function dashboard(){return `<div class="notice">● 当前为结构性页面示意，所有图形为占位；营业收入口径与真实数据尚未验证。</div><div class="grid3">${['营业收入','收入同比','新增客户'].map(t=>`<button class="kpi selectable" data-object="${t}"><span>${t}</span><div class="value">— — —</div><small>候选指标 · 待确认 / 待接入</small></button>`).join('')}</div><div class="grid2"><section class="widget selectable" data-object="月度收入趋势"><h3>月度收入趋势</h3><div class="sub">● 本期（示意）　● 上期（示意）</div><svg class="chart" viewBox="0 0 530 180" role="img" aria-label="收入趋势结构占位，无真实数值"><path d="M20 30H510M20 75H510M20 120H510M20 155H510" stroke="#e9eef8" stroke-dasharray="4 5" fill="none"/><path d="M20 138L75 117L130 130L185 90L240 100L295 68L350 82L405 47L460 38L510 25" fill="none" stroke="#5278ef" stroke-width="3"/><path d="M20 149L75 140L130 145L185 116L240 112L295 120L350 98L405 104L460 80L510 71" fill="none" stroke="#c8d6f0" stroke-width="2" stroke-dasharray="6 5"/><g fill="#97a7c1" font-size="10"><text x="20" y="176">1月</text><text x="130" y="176">3月</text><text x="240" y="176">5月</text><text x="350" y="176">7月</text><text x="485" y="176">9月</text></g></svg></section><section class="widget selectable" data-object="分公司收入排名"><h3>分公司收入排名</h3><small>交互意图：分公司 → 营业部 → 明细</small>${['深圳','上海','北京','广州','杭州'].map((t,i)=>`<div class="rank"><span>${t}</span><div class="track"><div class="fill" style="width:${90-i*13}%"></div></div><small>示意</small></div>`).join('')}</section></div><div class="grid2"><section class="widget selectable" data-object="分公司经营明细"><h3>分公司经营明细</h3>${table(['机构','收入','同比','操作'],['深圳','上海','北京'].map(t=>[t,'待接入','—','明细意图 ›']))}</section><section class="widget analysis selectable" data-object="AI 经营解读占位"><h3 style="color:#4d71d9">✦ AI 经营解读 · S06 可选</h3><p>可在真实数据对接后配置，或上线后追加。<br>分析基于授权数据与证据，不使用占位数字。</p><p>当前未启用 · 不阻塞主流程发布</p></section></div>`}
function requirements(){return `<div class="notice">蓝图对象与页面对象关联；“待确认”与“已确认”分别呈现，AI 建议不能自动成为需求结论。</div><div class="pagecards">${[['经营总览','管理层快速识别收入、客户和机构表现','KPI / 趋势 / 机构排名'],['收入分析','拆解收入结构与变化，查看组织差异','收入构成 / 同比 / 组织对比'],['客户分析','了解新增、存量及活跃客户情况','新增客户 / 客户结构'],['交易分析','跟踪交易规模与关键变化','交易规模 / 趋势 / 明细']].map(([n,d,c])=>`<button class="pagecard selectable" data-object="${n}"><h3>${n}</h3><p>${d}</p>${pill(c)} <p>来源：业务需求 · 结构草案</p></button>`).join('')}</div><div class="section-title"><h3>待确认的关键决策</h3>${pill('需求示意','amber')}</div>${table(['需求项','当前意见','状态'],[['收入统计口径','需业务责任人确认','待确认'],['组织下钻路径','总部 → 分公司 → 营业部','建议'],['主要使用对象','总部管理层','用户输入']])}`}
function interactions(){return `<div class="notice">此页展示 S02 的交互设计目标；本评审稿不执行经营数据筛选或下钻。</div><div class="flow"><div class="flowbox"><small>事件来源</small><strong>点击分公司排名</strong><p>获得组织 ID<br>继承当前日期</p></div><span class="flowarrow">→</span><div class="flowbox"><small>作用范围</small><strong>更新页面参数</strong><p>限定当前页面<br>清空下级组织选择</p></div><span class="flowarrow">→</span><div class="flowbox"><small>目标结果</small><strong>进入营业部视角</strong><p>刷新 KPI / 趋势 / 明细<br>支持返回上级</p></div></div><div class="section-title"><h3>交互与数据契约</h3></div>${table(['对象','输入 / 事件','预期反馈'],[['机构筛选器','组织 ID · 页面级','相关组件更新，分页归一'],['收入趋势','时间粒度 · 日期范围','按同一统计范围重算'],['明细穿透','当前组织与日期','目标页保留查询上下文'],['运行与调试','加载 / 空态 / 失败','显示输入、事件路径和结果']])}`}
function dataScreen(){const rows=subtab===0?[['营业收入','营业收入候选指标','口径待核对'],['收入趋势','收入 × 月份','时间粒度待验证'],['机构筛选','组织维度候选值','权限范围待验证'],['经营明细','明细数据能力','能力待核实']]:subtab===1?[['营业收入 KPI','查询结果 → 数值端口','待绑定'],['机构筛选器','组织值接口 → 选项端口','待绑定'],['排名下钻','组织参数 → 真实过滤','待验证'],['明细表','字段 / 排序 / 分页映射','待验证']]:[['必要数据端口','无残留 Mock','未执行'],['交互链路回归','筛选 / 下钻 / 穿透','未执行'],['业务口径核对','独立基准 / 责任人确认','缺少证据'],['权限验证','当前用户授权范围','未执行']];return `<div class="notice">此处全部为对接设计示意，尚未连接指标服务。未执行的验证不显示为通过。</div>${table(['页面需求',subtab===0?'候选能力':subtab===1?'绑定规划':'验证要求','示意状态'],rows)}<div class="boundary"><div><h3>语义匹配</h3><p>指标语义以权威定义为准，企业文档补充解释；冲突需要人工处理。</p></div><div><h3>真实执行</h3><p>沿用 S02 的页面与交互；后端负责身份、权限和真实查询。</p></div><div><h3>证据与缺口</h3><p>绑定成功与业务正确分开验证；不能用 Mock 掩盖真实失败。</p></div></div>`}
function acceptance(){return `<div class="notice">设计示意：尚无真实验收与审批证据，正式发布保持阻断。</div><div class="grid3">${[['候选版本','待冻结','对齐需求 / 页面 / 数据快照'],['验收证据','未执行','关键交互、口径与权限'],['发布门禁','阻断','缺少证据与审批']].map(([n,v,d])=>`<div class="kpi"><span>${n}</span><div class="counter">${v}</div><small>${d}</small></div>`).join('')}</div><div class="status-list">${(subtab===1?[['页面与交互缺陷','返回 S02 修改，新候选版本重新回归'],['数据与口径缺陷','返回 S03 修复，保留问题与证据关联'],['发布流程缺陷','由 S04 处理，保留恢复记录']]:subtab===2?[['验收基线与证据','必须指向当前候选版本'],['业务确认与必要审批','授权负责人确认，AI 不独立放行'],['上线与恢复准备','独立入口、线上冒烟、回退旧版 / 撤销首次入口']]:[['需求与交互验收','从 S01 / S02 追溯关键路径及预期'],['数据与权限核验','展示结果、业务口径、真实授权分别验证'],['问题与回归闭环','整改产生新快照，受影响项重新验证']]).map(([n,d])=>`<div class="status-item"><div><strong>${n}</strong><p>${d}</p></div>${pill('待验证','amber')}</div>`).join('')}</div>`}
function assets(){if(subtab===0)return `<div class="notice">资产示例仅用于展示目录设计。草稿按协作权限可见；正式版本、使用权限与数据授权分别管理。</div><div class="asset-grid">${[['经纪业务经营驾驶舱','完整产品','正式版 / 工作版隔离'],['营业部收入排名','业务组件','复制或固定版本引用'],['经营总览 + 明细','模板','实例化为独立产品']].map(([n,t,d])=>`<button class="pagecard selectable" data-object="${n}"><div class="asset-preview"><span></span><span></span><span></span></div>${pill(t,'blue')}<h3 style="margin-top:13px">${n}</h3><p>${d}</p><small>示例资产 · 非真实资产目录</small></button>`).join('')}</div>`;return `<div class="notice">资产生命周期与健康状态独立。线上内容修改先创建工作版本，发布仍回到 S04。</div>${table(['管理对象','规则','后续路径'],subtab===1?[['正式版本','不可原地覆盖','创建工作版本'],['业务组件引用','固定版本，受控升级','影响评估 → 验证 → 发布'],['历史恢复','恢复为新候选，不直接上线','S04 重新验收'],['数据刷新','不是产品版本升级','沿用已审核定义']]:[['需求调整','重走相关阶段','S01 → S02 / S03 → S04'],['页面与交互修改','工作版本隔离','S02 → S04'],['查询与指标变更','重验数据及口径','S03 → S04'],['标签 / 负责人维护','按授权更新与审计','S05 管理操作']])}`}
function overview(){return `${intro('从一个业务想法，到可持续运营的数据产品','S01 → S05 是主线；沿用同一产品、同一版本关系和同一协作上下文。')}<div class="flow">${stages.map((s,i)=>`<div class="flowbox"><small>${s.id}</small><strong>${s.name}</strong><p>${s.deliver.split(' + ').join('<br>')}</p><button class="btn" data-stage="${i}">查看页面 ↗</button></div>${i<4?'<span class="flowarrow">→</span>':''}`).join('')}</div><div class="lifecycle">↶ <strong>持续迭代：</strong>S05 创建工作版本 → 按变更影响返回 S01 / S02 / S03 → S04 重新验收发布 → S05 记录新版本。发现问题可回到对应阶段，不覆盖已确认基线。</div><div class="section-title"><h3>独立可选能力</h3>${pill('S06 尚无独立交付包')}</div><section class="widget analysis"><div class="row wrap"><h3>✦ AI 解读助手</h3>${pill('可选','blue')}</div><p style="font-size:12px;line-height:1.9;color:#7789a4;margin-top:10px">S03 真实数据对接后可配置，也可上线后追加。提供问答、指标解读、异常分析、归因探索与分析报告。关闭不阻塞主流程发布；启用或追加时，能力本身纳入相应验收和发布。</p></section><div class="section-title"><h3>贯穿全流程的工作台底座</h3></div><div class="boundary"><div><h3>统一产品上下文</h3><p>产品、工作版本、当前页面、选中对象和引用资料随阶段保留；阶段变化不新开一套孤立会话。</p></div><div><h3>可审查的 AI 变更</h3><p>提案 → 差异与影响 → 确认 → 应用 → 撤销 / 恢复。业务确认与发布授权由人掌握。</p></div><div><h3>可信状态与证据</h3><p>需求确认、页面可运行、数据已验证、发布已完成各有独立状态，不用一个完成率混合表达。</p></div></div>`}
function layout(){return `${intro('以 S01 为视觉基线，统一整个共创工作台','保留双栏共创的轻量感，把复杂配置收进按需面板。')}<div class="annotation-key">桌面参考：1600 × 1050　｜　A 66px　B 330–360px　｜　E 主画布自适应</div><div class="layout-map"><div class="zone a">A · 全局导航</div><div class="zone b"><strong>B · AI 对话区</strong><br>阶段角色<br>当前对象与引用<br>用户输入 / AI 建议<br>变更提案与影响<br><br><br>─────────<br>固定底部输入区<br><br>上下文与画布双向关联</div><div class="zone c"><strong>C · 产品与版本工具栏</strong>返回 / 产品名 / 工作版本 / 版本记录 / 阶段交付</div><div class="zone d"><strong>D · 阶段与视图工具栏</strong>S01–S05 / 阶段内视图 / 选择与体验 / 属性入口</div><div class="zone e"><strong>E · 可视化主画布</strong>按阶段切换需求、页面、数据、验收、资产视图<br><br>留足成果展示与操作空间<div class="zone f"><strong>F · 按需属性</strong>对象信息<br>关联需求<br>数据 / 交互状态<br>影响范围<br><small>默认收起</small></div><div class="zone g" style="max-width:55%"><strong>G · 变更提案</strong>差异 / 影响 / 确认 / 撤销</div></div></div><div class="boundary"><div><h3>视觉连续</h3><p>深蓝导航、白色表面、蓝色交互、浅灰画布。内容层次由留白与细边框建立。</p></div><div><h3>渐进展开</h3><p>页面树、指标详情、调试与属性按场景出现；不把所有工具永久挤进主界面。</p></div><div><h3>窄屏策略</h3><p>桌面优先。窄屏折叠对话与属性；手机以查看、讨论和确认为主。</p></div></div>`}
function render(){const s=stages[current];$('stages').innerHTML=stages.map((t,i)=>`${i?'<span class="stage-arrow">›</span>':''}<button class="stage ${i===current?'active':''}" data-stage="${i}" aria-pressed="${i===current}"><span>${t.id}</span><strong>${t.name}</strong></button>`).join('');$('agentTitle').textContent=s.agent+' ✦';$('context').textContent=s.name+' / '+selected;$('messages').innerHTML=`<div class="message user"><div class="who">你 · 需求示例</div><div class="bubble">${s.user}</div></div><div class="message"><div class="who"><span class="ai-badge">AI</span>MateClaw · ${s.agent}</div><div class="bubble"><p>${s.reply}</p><div class="suggestion">✦ ${s.tip}</div></div></div><div class="message"><div class="who"><span class="ai-badge">AI</span>阶段成果</div><div class="bubble">${s.deliver}</div></div>`;$('canvasTitle').textContent=view==='overview'?'◇ 工作台整体流程蓝图':view==='layout'?'▧ 工作台空间布局蓝图':`◆ ${s.id} · ${s.name}`;$('canvasSubtitle').textContent=view==='screen'?s.sub:'设计评审稿 · 以 S01 视觉风格统一各阶段体验';$('content').innerHTML=view==='overview'?overview():view==='layout'?layout():`${intro(current<2?'经营分析总览':current===2?'让页面连接可信数据':current===3?'候选版本验收与发布':'数据产品资产中心',s.sub)}${tabs()}${current===0?(subtab===0?dashboard():subtab===1?requirements():`<div class="notice">对照视图以需求关联定位页面对象；本稿仅展示结构映射。</div>${table(['需求意图','页面对象','状态'],[['快速判断经营表现','经营总览 / KPI 区','结构草案'],['识别机构收入差异','分公司收入排名','口径待确认'],['从机构进入明细','排名 → 营业部 → 明细','交互意图']])}${dashboard()}`):current===1?(subtab===0?dashboard():subtab===1?interactions():runtimeDesign()):current===2?dataScreen():current===3?acceptance():assets()}${deliver()}`;$('footerState').textContent=s.id+' / '+s.state;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});$('drawer').hidden=true;document.querySelectorAll('#content .selectable').forEach(el=>{if(el.tagName!=='BUTTON'){el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','选择'+el.dataset.object);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(el)}})}})}
function pick(el){selected=el.dataset.object;document.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));el.classList.add('selected');$('context').textContent=stages[current].name+' / '+selected;openProperties()}
function openProperties(){$('drawer').innerHTML=`<button class="close" aria-label="关闭属性">×</button><div class="eyebrow">OBJECT CONTEXT</div><h3>${selected}</h3><label>所属阶段</label><p>${stages[current].id} · ${stages[current].name}</p><label>对象与需求关联</label><p>让用户理解当前对象的业务目的、展示方式与交互意图。</p><label>状态</label><p>设计示意 · 尚未接入真实业务能力</p><label>讨论范围</label><p>默认只讨论当前对象。全局修改需明确范围，涉及基线变化时展示差异和影响。</p><div class="notice" style="margin-top:24px">选中对象后，左侧协作上下文同步更新。</div>`;$('drawer').hidden=false;$('drawer').querySelector('button').onclick=()=>{$('drawer').hidden=true;$('properties').focus()}}
function showModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}
function showHandoff(){const s=stages[current];showModal(s.id+' · 阶段移交设计',`<p><strong>交付成果</strong><br>${s.deliver}</p><p><strong>移交条件</strong><br>${s.gate}</p><div class="notice">本评审稿不执行阶段确认、保存、验收或发布。切换阶段仅用于查看设计。</div>`)}
document.addEventListener('click',e=>{const st=e.target.closest('[data-stage]'),vt=e.target.closest('[data-view]'),tab=e.target.closest('[data-tab]'),obj=e.target.closest('[data-object]'),nav=e.target.closest('[data-nav]');if(st){current=Number(st.dataset.stage);subtab=0;selected='产品整体';view='screen';render()}else if(vt){view=vt.dataset.view;render()}else if(tab){subtab=Number(tab.dataset.tab);render()}else if(obj){pick(obj)}else if(e.target.closest('[data-action="handoff"]'))showHandoff();else if(nav){if(nav.dataset.nav==='home')showModal('产品入口设计','<p>洞察 / 我的数据产品 → 自由描述新需求、上传参考或从已有模板开始；也可以继续最近的工作草稿。</p><p>进入后恢复产品、阶段、视图、页面与选择上下文。</p>');else{current=nav.dataset.nav==='assets'?4:current;view=nav.dataset.nav==='map'?'overview':'screen';subtab=0;selected='产品整体';render()}document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b===nav))}});
$('handoff').onclick=showHandoff;$('properties').onclick=openProperties;$('selectMode').onclick=()=>showModal('选择与体验的设计边界','<p>选择模式：点击对象，更新 AI 上下文并打开属性；本评审稿已演示此路径。</p><p>体验模式：在正式 S02 产物中执行筛选、联动、下钻与导航；S01 未实现路线必须明确标记为演示。</p>');$('history').onclick=()=>showModal('版本与草稿设计','<p>阶段内：自动草稿、撤销、变更集、命名快照与差异比较。</p><p>跨阶段：交付物引用同一产品的明确基线；上游修改产生新版本并标记下游影响。</p><p>线上：正式版本不可原地覆盖。S05 创建工作版，经相应阶段修改后回到 S04 验收发布。</p>');$('sampleChange').onclick=()=>showModal('AI 变更提案 · 示例','<p><strong>建议：</strong>为分公司收入排名增加营业部下钻。</p><p><strong>影响：</strong>经营总览排名组件、下钻路径、目标明细页；保留其他页面。</p><p><strong>待核实：</strong>指标是否支持营业部维度，当前用户是否有明细访问权限。</p><div class="notice">正式交互：预览差异 → 用户确认 → 应用为可撤销变更。本示例只供评审，不修改产品。</div>');$('closeModal').onclick=()=>$('modal').close();$('chatToggle').onclick=()=>{$('chat').classList.toggle('visible')};render();
</script>
</body>
</html>
