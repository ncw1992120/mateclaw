server:
  port: 18089
  servlet:
    context-path: /dataagent/api

spring:
  application:
    name: mateclaw-dataagent
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  elasticsearch:
    uris: ${ES_URIS:http://es.service:80}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:TWMM22KT82GJW7P77LK87lY4}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:data_agent}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # 显式声明池防护参数（与 server 侧对齐），不依赖 server JAR 内 application.yml 的隐式继承：
      # max-lifetime(30min) 须小于 MySQL wait_timeout(默认 8h)，避免取到已被服务端断开的连接；
      # idle-timeout 须小于 max-lifetime；leak-detection 在连接持有超阈值时打印获取堆栈，
      # 便于定位 Agent 执行 / Python 分析链路上的长事务。
      connection-timeout: 30000        # 获取连接最长等待 30s
      idle-timeout: 600000             # 空闲连接 10min 回收
      max-lifetime: 1800000            # 连接最大存活 30min
      leak-detection-threshold: 60000  # 持有超 60s 输出疑似泄漏告警
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "199"
    locations:
      - classpath:db/migration/mysql
    validate-on-migrate: true
    clean-disabled: true
    placeholder-replacement: false
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:configure-in-admin-ui}

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  # 不使用全局逻辑删除：逻辑删除改为在需要软删语义的实体上显式声明 @TableLogic，
  # 避免宿主应用配置污染 server 层实体的删除行为（如绑定表软删残留撞唯一索引）

mateclaw:
  jwt:
    secret: ${JWT_SECRET:MateClaw-JWT-Secret-Key-2024-Please-Change-In-Production}
    expiration: 86400000
  # ========== 平安领航认证（企业内部账密代验） ==========
  # enabled=false 时完全走本地账密登录，行为与历史版本一致；
  # 置 true 后 /v1/auth/login 切换为领航代验，admin 等白名单账号仍走本地兜底。
  # sso-server / sso-renewal-server 本期预留（账密代验模式不维护企业侧会话）。
  # authn-type 为默认认证类型（UM=域账号 / AD=用户主机账号），
  # 登录请求可逐次传 authnType 覆盖；验证码接口的 authMechanism 传同一值。
  pilot:
    enabled: ${MATECLAW_PILOT_ENABLED:true}
    auth-server: ${MATECLAW_PILOT_AUTH_SERVER:https://dove-dev.pilotcloud-dev.paic.com.cn:10081/v3/assertion}
    captcha-server: ${MATECLAW_PILOT_CAPTCHA_SERVER:https://dove-dev.pilotcloud-dev.paic.com.cn:10081/v3/assertion/captcha}
    sso-server: ${MATECLAW_PILOT_TOKEN_SERVER:https://dove-dev.pilotcloud-dev.paic.com.cn:10081/v3/assertion/sso}
    sso-renewal-server: ${MATECLAW_PILOT_SSO_RENEWAL_SERVER:https://dove-dev.pilotcloud-dev.paic.com.cn:10081/v3/sso/renewal}
    # 浏览器共享域上的领航 SSO Cookie 名（免登探测用）；已确认域为 .paic.com.cn、非 HttpOnly
    sso-cookie-name: ${MATECLAW_PILOT_SSO_COOKIE_NAME:CAS_SSO_COOKIE}
    authn-type: ${MATECLAW_PILOT_AUTHN_TYPE:UM}
    life-time: "432000"
    timeout: 5s
    local-fallback-users:
      - admin
  mcp:
    enabled: true
  skill:
    workspace:
      root: ${user.home}/.mateclaw/skills
      auto-init: true
      delete-policy: archive
    hub:
      base-url: https://clawhub.ai
      search-path: /api/v1/search
      skills-path: /api/v1/skills
      download-path: /api/v1/download
      http-timeout: 15
      http-retries: 3
  plugin:
    enabled: true
    user-dir: ${user.home}/.mateclaw/plugins
  hooks:
    enabled: true
    global-rate-limit: 200
    global-concurrency: 32
    dispatch-deadline: 5s
    trusted-domains: []
  runtime:
    flyway-enabled: true
  # Python 代码执行器配置
  code-executor:
    enabled: ${PYTHON_EXECUTOR_ENABLED:true}
    python-command: ${PYTHON_COMMAND:}
    pip-command: ${PIP_COMMAND:}
    code-timeout-seconds: ${PYTHON_CODE_TIMEOUT:60}
    pip-timeout-seconds: ${PYTHON_PIP_TIMEOUT:120}
    max-retries: ${PYTHON_MAX_RETRIES:3}
    max-std-out-length: ${PYTHON_MAX_STDOUT:50000}
    max-std-err-length: ${PYTHON_MAX_STDERR:10000}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html

# MateClaw Agent 配置（DataAgent 侧扩展）
# tool-result.excluded-tools 在此完整声明：Spring Boot 对 List 属性是整体覆盖
# 而非追加，故须包含 server 默认的通用检索工具 + DataAgent 业务检索工具。
# aloudata_search_semantic / search_business_term 的输出（指标/维度命中、族级
# 口径提示、消歧提示）是 LLM 构造 metrics_query 的核心决策依据，spill 到磁盘
# 会迫使 LLM 读 800 字符 preview 再 read_file（浪费 tool-call 槽位）或在残缺
# 数据上决策，故纳入排除列表，极端超预算时走 excludedToolInlineChars 内联压缩。
mate:
  agent:
    tool-result:
      excluded-tools:
        - read_file
        - read_workspace_memory_file
        - aloudata_search_semantic
        - search_business_term
