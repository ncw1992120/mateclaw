[project]
name = "mateclaw-dataagent-python-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas==2.2.3",
  "polars==1.20.0",
  "pydantic==2.13.5",
  "pyarrow==18.1.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
